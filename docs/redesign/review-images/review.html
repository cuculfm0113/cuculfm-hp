<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>CUCUL FM — UIレビュー</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; color: #e7eaf0; background: #000510; }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.8; }
    main { max-width: 1500px; margin: auto; padding: 48px clamp(20px, 4vw, 56px) 72px; }
    header { padding-bottom: 32px; border-bottom: 1px solid #293342; }
    .label { margin: 0 0 10px; color: #f5e100; font-size: 12px; letter-spacing: .12em; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 36px); line-height: 1.5; }
    .intro { margin: 14px 0 0; color: #adb5c4; font-size: 14px; }
    nav { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 20px; }
    a { color: inherit; text-underline-offset: 5px; }
    nav a { display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; }
    a:hover { color: #f5e100; }
    a:focus-visible { outline: 2px solid #f5e100; outline-offset: 5px; }
    section { margin-top: 48px; }
    h2 { margin: 0 0 20px; font-size: 20px; }
    .pair, .desktop-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .mobile-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: start; }
    figure { min-width: 0; margin: 0; }
    figure > a { display: block; overflow: hidden; border: 1px solid #293342; border-radius: 10px; background: #0b1220; }
    img { display: block; width: 100%; height: auto; }
    figcaption { margin-top: 12px; font-size: 14px; }
    figcaption strong { color: #f5e100; font-size: 12px; letter-spacing: .04em; margin-right: 8px; }
    .mobile-grid figure { width: 100%; max-width: 390px; }
    .note { padding-top: 24px; margin-top: 48px; border-top: 1px solid #293342; color: #adb5c4; font-size: 13px; }
    @media (max-width: 760px) {
      main { padding-top: 32px; }
      .pair, .desktop-grid { grid-template-columns: 1fr; gap: 28px; }
      .mobile-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) { .mobile-grid { grid-template-columns: 1fr; gap: 28px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="label">LOCAL REVIEW · 2026-09-18</p>
      <h1>CUCUL FM — UIレビュー</h1>
      <p class="intro">改修前後と主要画面のスクリーンショット。画像を選ぶと元のサイズで開きます。</p>
      <nav aria-label="ローカルプレビュー">
        <a href="/">トップを確認 ↗</a>
        <a href="/fde/">FDEを確認 ↗</a>
        <a href="/about/">会社概要を確認 ↗</a>
        <a href="/insights/">Insightsを確認 ↗</a>
      </nav>
    </header>

    <section aria-labelledby="hero-title">
      <h2 id="hero-title">ヒーロー — 改修前後</h2>
      <div class="pair">
        <figure><a href="hero-before-1440.jpg"><img src="hero-before-1440.jpg" width="1425" height="891" alt="改修前のトップのヒーロー画面"></a><figcaption><strong>BEFORE</strong>改修前</figcaption></figure>
        <figure><a href="hero-after-1440.jpg"><img src="hero-after-1440.jpg" width="1425" height="891" alt="改修後のトップのヒーロー画面"></a><figcaption><strong>AFTER</strong>改修後</figcaption></figure>
      </div>
    </section>

    <section aria-labelledby="statement-title">
      <h2 id="statement-title">ヒーロー直後のメッセージ — 改修前後</h2>
      <div class="pair">
        <figure><a href="statement-before-1440.jpg"><img src="statement-before-1440.jpg" width="1425" height="891" loading="lazy" alt="改修前のメッセージと事業への導線"></a><figcaption><strong>BEFORE</strong>改修前</figcaption></figure>
        <figure><a href="statement-after-1440.jpg"><img src="statement-after-1440.jpg" width="1425" height="891" loading="lazy" alt="改修後のメッセージと事業への導線"></a><figcaption><strong>AFTER</strong>改修後</figcaption></figure>
      </div>
    </section>

    <section aria-labelledby="desktop-title">
      <h2 id="desktop-title">主要画面 — デスクトップ</h2>
      <div class="desktop-grid">
        <figure><a href="business-after-1440.jpg"><img src="business-after-1440.jpg" width="1425" height="891" loading="lazy" alt="改修後のトップ事業セクション"></a><figcaption>トップ / 事業一覧</figcaption></figure>
        <figure><a href="fde-cross-after-1440.jpg"><img src="fde-cross-after-1440.jpg" width="1425" height="891" loading="lazy" alt="改修後のトップFDE横断セクション"></a><figcaption>トップ / FDE横断セクション</figcaption></figure>
        <figure><a href="fde-after-1440.jpg"><img src="fde-after-1440.jpg" width="1425" height="891" loading="lazy" alt="改修後のFDEページ"></a><figcaption>FDE</figcaption></figure>
        <figure><a href="company-after-1440.jpg"><img src="company-after-1440.jpg" width="1425" height="891" loading="lazy" alt="改修後の会社概要ページ"></a><figcaption>会社概要</figcaption></figure>
        <figure><a href="insights-after-1440.jpg"><img src="insights-after-1440.jpg" width="1425" height="891" loading="lazy" alt="改修後のInsights記事一覧"></a><figcaption>Insights / 記事一覧</figcaption></figure>
      </div>
    </section>

    <section aria-labelledby="mobile-title">
      <h2 id="mobile-title">主要画面 — モバイル幅</h2>
      <div class="mobile-grid">
        <figure><a href="fde-steps-after-390.jpg"><img src="fde-steps-after-390.jpg" width="375" height="812" loading="lazy" alt="モバイル幅のFDEの進め方"></a><figcaption>FDE / 進め方</figcaption></figure>
        <figure><a href="about-after-390.jpg"><img src="about-after-390.jpg" width="375" height="812" loading="lazy" alt="モバイル幅の会社概要"></a><figcaption>会社概要</figcaption></figure>
        <figure><a href="form-after-390.jpg"><img src="form-after-390.jpg" width="375" height="812" loading="lazy" alt="モバイル幅のお問い合わせフォーム"></a><figcaption>お問い合わせ</figcaption></figure>
      </div>
    </section>

    <p class="note">ローカル確認用。動作確認の範囲と結果は <a href="../09-moonlight-ui.md">検証記録</a>を参照してください。</p>
  </main>
</body>
</html>
